# Local development: just the stateful services. Run the app on the host (make run).
services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: wh}
    ports: ["5432:5432"]
    volumes: [pgdata-dev:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 2s, retries: 20}
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports: ["16686:16686", "4318:4318"]
volumes:
  pgdata-dev:
