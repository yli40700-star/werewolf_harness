global: {scrape_interval: 5s}
scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api1:8402", "api2:8402"]}]
  # one A record per replica (`--scale worker=N`); re-resolved every 5 s so a scale-up shows within a scrape or two
  - job_name: worker
    dns_sd_configs: [{names: ["worker"], type: A, port: 9100, refresh_interval: 5s}]
