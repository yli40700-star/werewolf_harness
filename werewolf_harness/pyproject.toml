[project]
name = "werewolf-harness"
version = "0.2.0"
description = "Werewolf on the Arena protocol: LLM seats, humans at the same table, and a recoverable online runtime."
requires-python = ">=3.10"
# The core (arena/ envs/ players/) is still standard-library only; everything
# below is for the online service in app/.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "pyjwt>=2.8",
  "pydantic-settings>=2.3",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  # imported by app/obs/tracing.py whenever OTEL_EXPORTER_OTLP_ENDPOINT is set
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.optional-dependencies]
# loadtest/ uses httpx + websockets as well as the tests
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2.3", "httpx>=0.27", "websockets>=12", "ruff>=0.5"]
# PROFILE_OUT=... on the API (load-test CPU profiles)
profile = ["yappi>=1.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs Postgres and Redis (DATABASE_URL / REDIS_URL)"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["web", "docs", "resume"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "ASYNC"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# the original core predates the linter; it is checked by its 168 tests, not by style rules
"arena/*" = ["ALL"]
"envs/*" = ["ALL"]
"players/*" = ["ALL"]
"server/*" = ["ALL"]
"tests/test_*.py" = ["ALL"]
"scripts/*" = ["ASYNC110"]  # benches poll on purpose
# the fault harness polls, blocks and spawns on purpose: it drives processes, it is not one
"faults/*" = ["ASYNC110", "ASYNC221", "ASYNC230", "ASYNC240"]
"*.py" = []
