# The package lives in werewolf_harness/ under the repository root; tests import it
# as `werewolf_harness`, so pytest runs from the root and make runs in the package.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PKG: werewolf_harness
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ---------------------------------------------------------------- 1. lint + unit
  unit:
    name: lint + unit (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: werewolf_harness/requirements-dev.lock
      - name: install (hash-locked)
        run: pip install --require-hashes -r $PKG/requirements-dev.lock
      - name: lint
        run: make -C $PKG lint PY=python
      - name: unit tests (no database)
        run: make -C $PKG test-core PY=python PYTEST_ARGS="--timeout 120 -p no:cacheprovider"

  # ---------------------------------------------------------------- 2. integration
  integration:
    name: integration (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: wh_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/wh_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: werewolf_harness/requirements-dev.lock
      - name: install (hash-locked)
        run: pip install --require-hashes -r $PKG/requirements-dev.lock
      - name: integration tests (Postgres + Redis)
        run: make -C $PKG test-int PY=python PYTEST_ARGS="--timeout 180 -p no:cacheprovider"
      # Slots for later phases. Each runs only once its Makefile target exists, so this
      # file need not change when they land: `make compat` (old journals still replay),
      # `make faults-quick` (fault injection, the CI subset), `make regress` (regression replays).
      - name: compat / fault-injection / regression replays (when present)
        env:
          FAULTS_OUT: /tmp/faults-quick.md
        run: |
          for t in compat faults-quick regress; do
            if make -C $PKG -n "$t" >/dev/null 2>&1; then
              echo "::group::make $t"; make -C $PKG "$t" PY=python; echo "::endgroup::"
            else
              echo "make $t: no such target yet, skipped"
            fi
          done

  # ---------------------------------------------------------------- 3. image + compose smoke
  docker:
    name: docker build + compose smoke
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image (linux/amd64, layer cache in GHA)
        uses: docker/build-push-action@v6
        with:
          context: werewolf_harness
          file: werewolf_harness/deploy/Dockerfile
          tags: werewolf-harness:local
          load: true
          cache-from: type=gha,scope=werewolf
          cache-to: type=gha,scope=werewolf,mode=max
      - name: image size
        run: docker image ls werewolf-harness:local
      - name: compose config
        run: docker compose -f $PKG/deploy/docker-compose.yml config -q
      - name: make smoke (up --wait, one mock game via Caddy, metrics, targets, dashboard, replay)
        run: make -C $PKG smoke BUILD=--no-build
      - name: compose logs
        if: failure()
        run: docker compose -f $PKG/deploy/docker-compose.yml logs --no-color --tail=200
      - name: down
        if: always()
        run: make -C $PKG down-v
      # Apple Silicon: the same Dockerfile must build for arm64 (QEMU; wheels only, no compiling)
      - uses: docker/setup-qemu-action@v3
      - name: build image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: werewolf_harness
          file: werewolf_harness/deploy/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=werewolf-arm64
          cache-to: type=gha,scope=werewolf-arm64,mode=max

  # ---------------------------------------------------------------- release (main only)
  image:
    needs: [unit, integration, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: image name
        run: echo "IMG=ghcr.io/${GITHUB_REPOSITORY,,}/werewolf" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: werewolf_harness
          file: werewolf_harness/deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMG }}:${{ github.sha }},${{ env.IMG }}:main
          cache-from: |
            type=gha,scope=werewolf
            type=gha,scope=werewolf-arm64

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: rolling restart on the VPS (standby first, then active)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd ~/werewolf_harness && git pull --ff-only
            C="docker compose -f werewolf_harness/deploy/docker-compose.yml --env-file werewolf_harness/.env"
            $C build
            $C run --rm --no-deps migrate          # synchronous: schema at head before any node restarts
            $C up -d --no-deps --wait worker
            $C up -d --no-deps --wait api2
            $C up -d --no-deps --wait api1
